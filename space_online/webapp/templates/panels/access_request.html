{% import "game/_ui.html" as ui %}
<h2>Access Control</h2>
<fieldset class="group">
  <legend>Requestable Jobs</legend>
  <div class="listbox">
    {% for job in p.jobs %}
      {{ ui.row(job, "panel.select", {"job": job}, job == p.selected) }}
    {% endfor %}
  </div>
</fieldset>
<fieldset class="group">
  <legend>Result</legend>
  <p class="result" style="color: {{ p.result.color }}">{{ p.result.text }}</p>
</fieldset>
{{ ui.feedback(p.feedback) }}
<div class="button-row">
  {{ ui.close_btn("Exit") }}
  {{ ui.btn("Assign", "panel.submit") }}
</div>
