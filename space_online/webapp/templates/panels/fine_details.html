{% import "game/_ui.html" as ui %}
<h2>Issue Fine</h2>
<form class="form-stack narrow-form" data-action="panel.confirm">
  <p>Issue a fine to {{ p.name }}:</p>
  <label for="fine-reason">Reason:</label>
  <input id="fine-reason" name="reason" type="text" maxlength="{{ p.max_length }}" autofocus>
  <label for="fine-amount">Amount (credits):</label>
  <input id="fine-amount" name="amount" type="text" inputmode="decimal">
  <div class="button-row">
    <button type="submit" class="btn">Confirm</button>
    {{ ui.close_btn("Cancel") }}
  </div>
</form>
