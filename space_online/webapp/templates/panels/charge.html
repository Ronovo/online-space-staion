{% import "game/_ui.html" as ui %}
<h2>{{ p.title }}</h2>
<form class="form-stack narrow-form" data-action="panel.confirm">
  <label for="charge-reason">Reason for {{ p.name }}'s {{ "fine" if p.fine else "warrant" }}:</label>
  <input id="charge-reason" name="reason" type="text" maxlength="{{ p.max_length }}" autofocus>
  {% if p.fine %}
  <label for="charge-amount">Amount (credits):</label>
  <input id="charge-amount" name="amount" type="text" inputmode="decimal">
  {% endif %}
  <div class="button-row">
    <button type="submit" class="btn">Confirm</button>
    {{ ui.close_btn("Cancel") }}
  </div>
</form>
