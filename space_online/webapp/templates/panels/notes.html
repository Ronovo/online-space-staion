{% import "game/_ui.html" as ui %}
<h2>Character Notes</h2>
<div class="text-block" data-scroll-key="notes">
  {% for note in p.notes %}
    <p class="note">{% if note.time %}<span class="note-time">{{ note.time }}:</span><br>{% endif %}{{ note.text }}</p>
  {% else %}
    <p>No notes recorded yet.</p>
  {% endfor %}
</div>
<div class="button-row">{{ ui.close_btn() }}</div>
