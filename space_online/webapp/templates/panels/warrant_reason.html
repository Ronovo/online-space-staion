{% import "game/_ui.html" as ui %}
<h2>Warrant Reason</h2>
<form class="form-stack narrow-form" data-action="panel.confirm">
  <label for="warrant-reason">Enter the reason for {{ p.name }}'s warrant:</label>
  <input id="warrant-reason" name="reason" type="text" maxlength="{{ p.max_length }}" autofocus>
  <div class="button-row">
    <button type="submit" class="btn">Confirm</button>
    {{ ui.close_btn("Cancel") }}
  </div>
</form>
