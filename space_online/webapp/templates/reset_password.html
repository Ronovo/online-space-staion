{% extends "base.html" %}
{% block title %}Reset Password - Space Station Explorer{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Reset Password</h1>
  <form method="post" class="form-stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if question %}
    <input type="hidden" name="username" value="{{ username }}">
    <p>{{ question }}</p>
    <label>Answer
      <input type="text" name="answer" maxlength="100" autocomplete="off" required autofocus>
    </label>
    <label>New Password
      <input type="password" name="password" autocomplete="new-password" minlength="6" maxlength="128" required>
    </label>
    <label>Confirm New Password
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="6" maxlength="128" required>
    </label>
    <button class="btn" type="submit">Reset Password</button>
    {% else %}
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <button class="btn" type="submit">Next</button>
    {% endif %}
  </form>
  <p class="muted"><a href="{{ url_for('login') }}">Back to log in</a></p>
</section>
{% endblock %}
