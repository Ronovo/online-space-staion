{% extends "base.html" %}
{% block title %}Character Creation - Space Station Explorer{% endblock %}
{% block content %}
<section class="card create-card">
  <h1>Character Creation</h1>
  <form method="post" class="create-form" id="create-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Character Name:</label>
    <div class="inline">
      <input type="text" id="name" name="name" value="{{ form.name }}" maxlength="40" required autofocus>
      <button class="btn btn-small" type="button" id="random-name">Random</button>
    </div>

    <label for="department">Department:</label>
    <select id="department" name="department">
      <option value="{{ select_department }}">{{ select_department }}</option>
      {% for dept, _ in departments %}
      <option value="{{ dept }}"{% if dept == form.department %} selected{% endif %}>{{ dept }}</option>
      {% endfor %}
    </select>

    <label for="job">Select Job:</label>
    <select id="job" name="job" data-selected="{{ form.job }}">
      <option value="{{ select_job }}">{{ select_job }}</option>
    </select>

    <span class="label-cell">Starting Credits:</span>
    <span id="job-credits">-</span>
  </form>

  <div class="job-description">
    <h2>Job Description:</h2>
    <p id="job-description">Select a department and job to see details.</p>
  </div>

  <div class="button-row">
    <button class="btn" type="submit" form="create-form">Start Game</button>
    <a class="btn" href="{{ url_for('home') }}">Back</a>
  </div>
</section>
<script id="creation-data" type="application/json">{{ {
  "departments": departments,
  "jobs": jobs,
  "names": npc_names,
  "selectJob": select_job,
}|tojson }}</script>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='create.js') }}"></script>
{% endblock %}
